<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sohoj Ride | Car Rental in Bangladesh</title>

<meta name="description" content="Sohoj Ride provides reliable car rental, airport transfer, private car, microbus and corporate travel services across Bangladesh.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",Arial,sans-serif;
    background:#f6f8fb;
    color:#152033;
}

:root{
    --primary:#6b35d9;
    --primary2:#8b5cf6;
    --dark:#111827;
    --text:#344054;
    --muted:#667085;
    --light:#f4efff;
    --border:#e5e7eb;
    --white:#fff;
    --green:#16a34a;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

.container{
    width:min(1200px,92%);
    margin:auto;
}

/* =========================
TOP OFFER BAR
========================= */

.offer-bar{
    background:#151126;
    color:#fff;
    min-height:40px;
    display:flex;
    align-items:center;
    overflow:hidden;
    font-size:12px;
    font-weight:600;
}

.offer-track{
    width:100%;
    white-space:nowrap;
    animation:scrollText 28s linear infinite;
}

@keyframes scrollText{
    0%{transform:translateX(100%);}
    100%{transform:translateX(-100%);}
}

/* =========================
NAVBAR
========================= */

.navbar{
    height:76px;
    background:#fff;
    border-bottom:1px solid #edf0f5;
    position:sticky;
    top:0;
    z-index:999;
}

.nav-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-symbol{
    width:43px;
    height:43px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:800;
    box-shadow:0 8px 25px rgba(107,53,217,.25);
}

.logo-name{
    font-family:Manrope,sans-serif;
    font-weight:800;
    font-size:21px;
    color:#141a28;
}

.logo-name span{
    color:var(--primary);
}

.nav-menu{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-menu a{
    color:#475467;
    font-size:13px;
    font-weight:600;
}

.nav-menu a:hover{
    color:var(--primary);
}

.nav-book{
    background:var(--primary);
    color:#fff!important;
    padding:12px 19px;
    border-radius:9px;
}

.mobile-menu{
    display:none;
    border:0;
    background:#f3efff;
    width:42px;
    height:42px;
    border-radius:10px;
    font-size:20px;
}

/* =========================
HERO
========================= */

.hero{
    min-height:620px;
    position:relative;
    overflow:hidden;
    color:#fff;

    background:
    linear-gradient(
        90deg,
        rgba(18,13,38,.94) 0%,
        rgba(26,17,55,.82) 46%,
        rgba(27,19,53,.42) 100%
    ),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2200&q=90")
    center/cover no-repeat;
}

.hero::before{
    content:"";
    position:absolute;
    width:520px;
    height:520px;
    right:-250px;
    top:-240px;
    border-radius:50%;
    background:rgba(139,92,246,.22);
}

.hero-content{
    min-height:620px;
    display:flex;
    align-items:center;
}

.hero-copy{
    width:57%;
    position:relative;
    z-index:2;
    padding:60px 0 130px;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:30px;
    background:rgba(255,255,255,.11);
    border:1px solid rgba(255,255,255,.17);
    font-size:11px;
    font-weight:700;
    margin-bottom:20px;
}

.hero-label i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#42e68a;
}

.hero h1{
    font-family:Manrope,sans-serif;
    font-size:clamp(40px,5vw,64px);
    line-height:1.05;
    letter-spacing:-2.5px;
    max-width:650px;
}

.hero h1 span{
    color:#b697ff;
}

.hero-text{
    color:rgba(255,255,255,.78);
    max-width:580px;
    margin-top:20px;
    font-size:15px;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    gap:12px;
    margin-top:28px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:9px;
    padding:13px 20px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn-purple{
    background:var(--primary);
    color:#fff;
}

.btn-purple:hover{
    background:#5827bd;
    transform:translateY(-2px);
}

.btn-green{
    background:#16a34a;
    color:#fff;
}

.btn-green:hover{
    background:#12853d;
    transform:translateY(-2px);
}

.btn-white{
    background:#fff;
    color:#202939;
}

.btn-white:hover{
    transform:translateY(-2px);
}

/* =========================
BOOKING CARD
========================= */

.booking-position{
    margin-top:-90px;
    position:relative;
    z-index:10;
}

.booking-card{
    background:#fff;
    border-radius:15px;
    box-shadow:0 18px 60px rgba(17,24,39,.14);
    border:1px solid #edf0f5;
    padding:23px;
}

.booking-tabs{
    display:flex;
    border-bottom:1px solid #e8eaf0;
    margin-bottom:21px;
}

.booking-tab{
    padding:11px 18px;
    border:0;
    background:transparent;
    color:#667085;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    position:relative;
}

.booking-tab.active{
    color:var(--primary);
}

.booking-tab.active:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-1px;
    height:2px;
    background:var(--primary);
}

.booking-grid{
    display:grid;
    grid-template-columns:1.1fr 1fr 1fr 1fr;
    gap:13px;
}

.form-field label{
    display:block;
    font-size:10px;
    font-weight:800;
    color:#667085;
    text-transform:uppercase;
    margin-bottom:6px;
    letter-spacing:.5px;
}

.form-field input,
.form-field select{
    width:100%;
    border:1px solid #dfe3e9;
    background:#fbfcfe;
    padding:12px;
    border-radius:8px;
    outline:0;
    color:#1d2939;
    font-size:12px;
}

.form-field input:focus,
.form-field select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(107,53,217,.08);
}

.booking-bottom{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:13px;
    margin-top:13px;
}

.booking-action{
    display:flex;
    align-items:end;
}

.booking-action button{
    width:100%;
    height:42px;
}

/* =========================
TRUST STATS
========================= */

.stats{
    background:#fff;
    padding:35px 0;
    border-bottom:1px solid #edf0f4;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.stat{
    text-align:center;
    border-right:1px solid #edf0f4;
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;
    font-family:Manrope,sans-serif;
    font-size:24px;
    color:#141b2b;
}

.stat span{
    color:#667085;
    font-size:11px;
}

/* =========================
SECTIONS
========================= */

section{
    padding:88px 0;
}

.section-head{
    text-align:center;
    max-width:680px;
    margin:0 auto 42px;
}

.kicker{
    color:var(--primary);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.7px;
    margin-bottom:9px;
}

.section-head h2{
    font-family:Manrope,sans-serif;
    font-size:35px;
    line-height:1.15;
    letter-spacing:-1px;
    margin-bottom:12px;
}

.section-head p{
    color:var(--muted);
    font-size:13px;
}

/* =========================
SERVICES
========================= */

.services{
    background:#f7f8fb;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.service-card{
    background:#fff;
    border:1px solid #e8ebf0;
    border-radius:14px;
    padding:24px;
    transition:.25s;
}

.service-card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 40px rgba(31,41,55,.08);
}

.service-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.service-icon{
    width:48px;
    height:48px;
    border-radius:12px;
    background:#f0ebff;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.service-tag{
    font-size:9px;
    font-weight:800;
    color:var(--primary);
    background:#f0ebff;
    padding:5px 8px;
    border-radius:20px;
}

.service-card h3{
    margin-top:20px;
    font-size:17px;
}

.service-card p{
    color:var(--muted);
    font-size:12px;
    margin:8px 0 16px;
}

.service-list{
    display:grid;
    gap:7px;
    margin-bottom:18px;
}

.service-list span{
    font-size:11px;
    color:#475467;
}

.service-list span::before{
    content:"✓";
    color:var(--green);
    font-weight:900;
    margin-right:7px;
}

/* =========================
FLEET
========================= */

.fleet{
    background:#fff;
}

.fleet-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.car-card{
    border:1px solid #e6e9ef;
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    transition:.25s;
}

.car-card:hover{
    transform:translateY(-5px);
    box-shadow:0 15px 45px rgba(31,41,55,.1);
}

.car-img{
    height:170px;
    position:relative;
    overflow:hidden;
    background:#eee;
}

.car-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.car-card:hover .car-img img{
    transform:scale(1.05);
}

.car-category{
    position:absolute;
    top:10px;
    left:10px;
    background:#fff;
    color:var(--primary);
    padding:5px 9px;
